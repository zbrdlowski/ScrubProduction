<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Scan Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-container label {
            display: block;
            margin: 10px 0 5px;
        }
        .form-container input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form-container button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<h2>Scan Item In/Out</h2>

<div class="form-container">
    <form action="scripts/scan_in.php" method="POST">
        <label for="barcode">Order Nr:</label>
        <input type="text" id="order_id" name="order_id" required>

        <label for="barcode">Item Barcode:</label>
        <input type="text" id="barcode" name="barcode" required>

        <label for="shelf_location">Shelf Location (e.g., A2-01-01):</label>
        <input type="text" id="shelf_location" name="shelf_location" required>

        <label for="quantity">Quantity (e.g., 1, 2,3):</label>
        <input type="text" id="quantity" name="quantity" required>

        <button type="submit">Scan Item In</button>
    </form>
</div>

<div class="form-container">
    <form action="scripts/scan_out.php" method="POST">
        <label for="barcode">Order Nr:</label>
        <input type="text" id="order_id" name="order_id" required>
        
        <label for="barcode_out">Item Barcode:</label>
        <input type="text" id="barcode_out" name="barcode" required>

        <label for="shelf_location_out">Shelf Location (e.g., A2-01-01):</label>
        <input type="text" id="shelf_location_out" name="shelf_location" required>

        <label for="quantity">Quantity (e.g., 1, 2,3):</label>
        <input type="text" id="quantity" name="quantity" required>

        <button type="submit">Scan Item Out</button>
    </form>
</div>

</body>
</html>
